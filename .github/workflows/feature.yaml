name: Feature Branch CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

jobs:
  fast-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

      - name: Unit tests
        run: go test ./...

      - name: Build check
        run: go build ./cmd/server  