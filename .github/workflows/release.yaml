name: Tag CD — Promote to Staging → Prod

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: read

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout source repo (REQUIRED for git + tags)
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ensures tags + full history available

      # Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ Resolve commit SHA from tag (CRITICAL FIX)
      - name: Get commit sha from tag
        id: meta
        run: |
          git fetch --tags
          SHA=$(git rev-list -n 1 ${{ github.ref_name }})
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      # Debug (optional, helps during failures)
      - name: Debug values
        run: |
          echo "Tag: ${{ github.ref_name }}"
          echo "Resolved SHA: ${{ steps.meta.outputs.sha }}"

      # ✅ Ensure image exists before verify (fail early)
      - name: Check image exists
        run: |
          docker manifest inspect docker.io/shilucloud/sigstore-app:main-${{ steps.meta.outputs.sha }} > /dev/null

      # Verify Cosign signature
      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/shilucloud/sigstore-app/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            docker.io/shilucloud/sigstore-app:main-${{ steps.meta.outputs.sha }}

      # Retag verified image → version tag (NO rebuild)
      - name: Retag image as version
        run: |
          docker pull docker.io/shilucloud/sigstore-app:main-${{ steps.meta.outputs.sha }}

          docker tag \
            docker.io/shilucloud/sigstore-app:main-${{ steps.meta.outputs.sha }} \
            docker.io/shilucloud/sigstore-app:${{ github.ref_name }}

          docker push docker.io/shilucloud/sigstore-app:${{ github.ref_name }}

      # Checkout GitOps repo
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: shilucloud/sigstore-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      # Update staging overlay image
      - name: Update staging image tag
        run: |
          cd gitops/apps/overlays/staging
          kustomize edit set image shilucloud/sigstore-app=docker.io/shilucloud/sigstore-app:${{ github.ref_name }}

      # Commit + push (safe commit)
      - name: Commit staging promotion
        run: |
          cd gitops
          git config user.email "shilash112001@gmail.com"
          git config user.name "CI Bot"

          git add .
          git diff --cached --quiet || git commit -m "chore: promote ${{ github.ref_name }} → staging"
          git push origin main

      # Wait for rollout (replace later with kubectl rollout status)
      - name: Wait for staging rollout
        run: sleep 30

      # Smoke test (placeholder)
      - name: Smoke test staging
        run: echo "Run real smoke tests here"

      # Open PR to promote to production
      - name: Open prod promotion PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
          branch: promote-${{ github.ref_name }}-to-prod
          base: main
          title: "promote ${{ github.ref_name }} to prod"
          body: |
            ## 🚀 Production Promotion

            **Version:** `${{ github.ref_name }}`
            **Image:** `docker.io/shilucloud/sigstore-app:${{ github.ref_name }}`

            - Cosign verified ✅
            - Staging validated ✅

            Merge to promote to production.
          commit-message: "chore: promote ${{ github.ref_name }} → prod"