name: Main CI — Build, Sign, Push

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write       # required for Fulcio OIDC — Cosign requests this token
  packages: write

jobs:
  build-sign-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Unit tests
        run: go test ./...

      # Install Cosign
      - uses: sigstore/cosign-installer@v3

      # Log in to registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push — tagged with the commit sha, never 'latest'
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: docker.io/shilucloud/sigstore-app:main-${{ github.sha }}

      # Cosign signs the image digest (not the tag — tags are mutable)
      # Fulcio issues an ephemeral cert from the OIDC token automatically
      # Rekor records the signing event permanently
      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            docker.io/shilucloud/sigstore-app@${{ steps.build.outputs.digest }}

      # Update the dev overlay in the gitops repo
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: shilucloud/sigstore-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update dev image tag
        run: |
          cd gitops/apps/overlays/dev
          kustomize edit set image sigstore-app=docker.io/shilucloud/sigstore-app:main-${{ github.sha }}

      - name: Commit and push to gitops repo
        run: |
          cd gitops
          git config user.email "shilash112001@gmail.com"
          git config user.name "CI Bot"
          git commit -am "chore: update dev → main-${{ github.sha }}"
          git push
        # ArgoCD watches this repo and auto-syncs dev on this commit